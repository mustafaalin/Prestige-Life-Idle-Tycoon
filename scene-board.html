<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sahne Panosu</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --line: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #8b5cf6;
        --note: #fbbf24;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, sans-serif; }
      header { position: sticky; top: 0; z-index: 10; background: rgba(15, 23, 42, 0.96); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
      header h1 { margin: 0; font-size: 18px; font-weight: 900; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .label { font-size: 10px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
      .chip { border: 0; border-radius: 999px; padding: 5px 10px; background: var(--panel); color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
      .chip.on { background: var(--accent); color: #fff; }
      .status { color: var(--muted); font-size: 12px; margin-left: auto; }
      main { padding: 16px; }
      section { margin-bottom: 40px; }
      section h2 { font-size: 16px; margin: 0 0 4px; }
      section p { margin: 0 0 12px; color: var(--muted); }
      .grid { display: flex; flex-wrap: wrap; gap: 20px; }
      .card { display: flex; flex-direction: column; gap: 6px; }
      .card.noted .frame { outline: 3px solid var(--note); }
      .code { font-weight: 900; color: var(--note); }
      .title { font-weight: 700; }
      .meta { color: var(--muted); font-size: 11px; }
      .frame { position: relative; overflow: hidden; border-radius: 24px; background: #0d1530; }
      .frame img { position: absolute; pointer-events: none; user-select: none; }
      .frame .bg { inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .frame .band { position: absolute; left: 0; right: 0; background: rgba(244, 63, 94, 0.25); }
      .frame .ground { position: absolute; left: 0; right: 0; height: 1px; background: #38bdf8; }
      .frame .safe { position: absolute; top: 0; bottom: 0; width: 1px; background: #f43f5e; }
      .frame .fitTag { position: absolute; left: 6px; top: 6px; border-radius: 8px; background: #f43f5e; padding: 2px 6px; font-size: 10px; font-weight: 900; color: #fff; }
      textarea { width: 100%; min-height: 64px; resize: vertical; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 8px; font: inherit; }
      textarea:focus { outline: 2px solid var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <div class="row">
        <h1>Sahne Panosu</h1>
        <span class="status" id="status"></span>
      </div>
      <div class="row" id="controls"></div>
    </header>
    <main id="board"></main>
    <script type="module" src="/src/game/ui/scene/sceneBoard.ts"></script>
  </body>
</html>
